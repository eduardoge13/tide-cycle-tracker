# Optional self-hosting recipe: nginx serving the static build behind an
# existing Traefik reverse proxy. Values come from .env (see .env.example).
services:
  tide:
    image: nginx:1.30-alpine
    container_name: tide
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tide.entrypoints=web,websecure"
      - "traefik.http.routers.tide.rule=Host(`${TIDE_HOST:?set TIDE_HOST in .env}`)"
      - "traefik.http.routers.tide.service=tide"
      - "traefik.http.routers.tide.tls=true"
      - "traefik.http.routers.tide.tls.certresolver=${CERT_RESOLVER:?set CERT_RESOLVER in .env}"
      - "traefik.http.services.tide.loadbalancer.server.port=80"

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}
    external: true
