# Static PWA. The server only ever serves these files; cycle data never reaches it.

# One Cache-Control per path. (A map instead of per-location add_header,
# because add_header inside a location drops every server-level header.)
map $uri $tide_cache {
    ~^/assets/   "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No visit logs: not even the IPs of who opens the app.
    access_log off;
    error_log /dev/stderr crit;
    server_tokens off;

    add_header Cache-Control $tide_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
